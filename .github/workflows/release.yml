name: Release

# Builds template_debug + template_release for linux/windows/macos/android/ios (arm64)/web, then
# packages project/addons/starter_template/ (source-free, binaries for every
# platform included) into a zip attached to a GitHub Release. The zip's
# internal layout is addons/starter_template/..., so it extracts directly
# into a project's root (res://). That zip is what's meant to be
# distributed -- either linked directly, or used as the "Custom" download
# URL in a Godot Asset Library submission, since the Asset Library's
# GitHub-commit-based download can't include build output that
# (deliberately) isn't committed to the repo.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: linux
            os: ubuntu-latest
            args: ""
          - name: windows
            platform: windows
            os: windows-latest
            args: ""
          - name: macos
            platform: macos
            os: macos-latest
            args: ""
          - name: android-arm64
            platform: android
            os: ubuntu-latest
            args: arch=arm64
          - name: ios
            platform: ios
            os: macos-latest
            args: arch=arm64
          - name: web
            platform: web
            os: ubuntu-latest
            args: ""
          - name: web-nothreads
            platform: web
            os: ubuntu-latest
            args: threads=no
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install SCons
        run: pip install scons

      - name: Install Emscripten
        if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.11

      - name: Install Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.1.13356709"

      # Pinned godot-cpp commit, so bumping the submodule invalidates the
      # cache key too.
      - name: Get submodule revisions
        id: submodules
        shell: bash
        run: echo "hash=$(git submodule status | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache SCons build
        uses: actions/cache@v6
        with:
          path: .scons_cache
          key: scons-release-${{ matrix.name }}-${{ hashFiles('src/**', 'SConstruct') }}-${{ steps.submodules.outputs.hash }}
          restore-keys: |
            scons-release-${{ matrix.name }}-

      # Runs the standalone (no godot-cpp) test in tests/ against template_debug
      # as a sanity check before spending time on the release build.
      - name: Build and test template_debug
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache
        run: |
          scons platform=${{ matrix.platform }} ${{ matrix.args }} target=template_debug
          scons tests

      - name: Build template_release
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache
        run: scons platform=${{ matrix.platform }} ${{ matrix.args }} target=template_release

      - name: Wrap iOS dylibs in xcframeworks
        if: matrix.platform == 'ios'
        working-directory: project/addons/starter_template/bin
        run: |
          for target in template_debug template_release; do
            xcodebuild -create-xcframework \
              -library libstarter_template.ios.$target.arm64.dylib \
              -output libstarter_template.ios.$target.xcframework
            rm libstarter_template.ios.$target.arm64.dylib
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: starter-template-bin-${{ matrix.name }}
          path: |
            project/addons/starter_template/bin/*.so
            project/addons/starter_template/bin/*.dll
            project/addons/starter_template/bin/*.dylib
            project/addons/starter_template/bin/*.xcframework
            project/addons/starter_template/bin/*.wasm

  package:
    name: Package addon
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download binaries for every platform
        uses: actions/download-artifact@v8
        with:
          pattern: starter-template-bin-*
          path: project/addons/starter_template/bin
          merge-multiple: true

      - name: Zip addon
        run: |
          cp LICENSE project/addons/starter_template/LICENSE
          cd project
          zip -r "${{ github.workspace }}/StarterTemplate.zip" addons/starter_template

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: StarterTemplate.zip
          generate_release_notes: true
